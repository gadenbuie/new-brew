name: data

on:
  schedule:
    # US work hours: 8am ET, 12:30pm ET, 5pm ET. Cron ignores DST, so these
    # drift an hour earlier in winter — acceptable per DESIGN.md.
    #
    # Times are shifted EARLIER to compensate for GitHub Actions schedule
    # queue delays (measured Oct 2026: ~2-4h late, growing through the day).
    # Intended-fire times are still 12:00, 16:30, 21:00 UTC; re-measure with
    # `gh run list --workflow data.yml` if runs drift again.
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run data generator
        run: node scripts/build-data.mjs
        timeout-minutes: 15

      # changes.json is untracked on main; it lives on gh-pages, the branch
      # Pages serves. Committing it there puts the fresh data live via the
      # Pages branch build — no deploy cascade, no bot commits on main.
      - name: Check out gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Commit and push if changed
        run: |
          cp static/data/changes.json site/data/changes.json
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/changes.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): rebuild changes.json"
            git push
          fi

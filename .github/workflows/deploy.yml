name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # gh-pages holds the published site, including the changes.json that
      # data.yml commits there (it's untracked on main).
      - name: Check out gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Publish build to gh-pages
        run: |
          # Carry over the freshest changes.json so the rebuild never
          # regresses the data committed by data.yml.
          mkdir -p build/data
          git -C site show HEAD:data/changes.json > build/data/changes.json
          rsync -a --delete --exclude .git build/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: site build from main@${GITHUB_SHA:0:7}"
            git push
          fi
